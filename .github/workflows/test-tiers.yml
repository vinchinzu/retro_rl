name: test tiers

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  ml-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra ml
      - run: uv run pytest retro_harness/fighters/tests retro_harness/platformer/tests -m "not rom"

  all-game-no-rom:
    runs-on: ubuntu-latest
    env:
      RETRO_RL_TEST_TIER: game-no-rom
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest snes nes -m "not rom and not ml"

  rom-smoke:
    if: ${{ vars.RUN_ROM_SMOKE == '1' }}
    runs-on: self-hosted
    env:
      RETRO_RL_RUN_ROM_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra ml
      - run: uv run pytest -o addopts="--import-mode=importlib" -m rom_smoke
