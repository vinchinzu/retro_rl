- title_to_castle_grounds
- castle_to_fighter_sword
- secret_entrance_clear
- pocket_to_main_hall_0x61
- castle_dungeon_prefix_0x50
- room_50_east_to_0x01_natural_entry
workFocusGroups:
- frontier
- zelda
- b1
mdIntro:
- Sanctuary-path practice queue for `Zelda3-Snes` save states.
- Continuous tip is **NW chamber room 0x50** (after `castle_dungeon_prefix`).
- 'Tip exit **0x50 east → 0x01** is natural_entry. Ranked for next work: **B1 stairs after
  0x01 chain → Zelda cell → follower → escort**.'
- Internal 0x55 key/shutter path is **alternate practice**, not primary.
mdNotes:
- Continuous tip is **NW chamber room 0x50** after `castle_dungeon_prefix` (courtyard pocket
  → main door → 0x60 → 0x50).
- 'Tip exit **0x50 east → 0x01** is graph natural_entry (2026-08-02 exhaustive probe: only
  physical forward exit from tip).'
- Secret-entrance clear (stairs → outdoor pocket) is already continuous; do **not** treat
  `Castle_55` internal exit as the top blocker.
- 'Primary next work: B1 stairs after 0x01 chain → Zelda cell → follower → escort → Sanctuary.'
- Internal 0x55 key/shutter path is **alternate practice** only.
- '`FighterSword` is a **dev checkpoint** after uncle sword; natural sword claim needs `--natural`
  on `castle_to_sword`.'
- 'Acceptance for rescue: `has_zelda_follower` (`$F3CC == 1`).'
- 'Sanctuary: room `0x12` / OW screen `0x13` — not claimed.'
