[project]
name = "retro_rl"
version = "0.1.0"
description = "Retro gaming RL environment harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.9.3",
    "numpy>=2.4.1",
    "pygame>=2.6.1",
    "pykakasi>=2.3.0",
    "pyside6>=6.10.2",
    "stable-retro>=0.9.8",
    "tensorboard>=2.20.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "stable-baselines3>=2.0.0",
    "gymnasium>=1.0.0",
    "opencv-python>=4.0.0",
]
cursor = [
    "cursor-sdk>=0.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "xdis>=6.3.0",
]
