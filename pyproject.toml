[project]
name = "retro_rl"
version = "0.1.0"
description = "Retro gaming RL environment harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.9.3",
    "numpy>=2.4.1",
    "pygame>=2.6.1",
    "pykakasi>=2.3.0",
    "pyside6>=6.10.2",
    "stable-retro>=0.9.8",
    "tensorboard>=2.20.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "stable-baselines3>=2.0.0",
    "gymnasium>=1.0.0",
    "opencv-python>=4.0.0",
]
cursor = [
    "cursor-sdk>=0.1.5",
]
smz3 = [
    "pyz3r>=6.1.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "slugid>=2.0.0",
    "tenacity>=8.0.0",
    "python-bps-continued>=7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "xdis>=6.3.0",
]

[tool.pytest.ini_options]
# Games keep package names (alttp, super_metroid, smb, …) under snes/ and nes/.
# Nested package workspaces (snes/<slug>/<slug>/) are added by root conftest via
# retro_harness.repo.discover_nested_package_roots — do not hardcode game slugs here.
pythonpath = [".", "snes", "nes"]
# Bare `pytest` is the always-on core gate.  ML, all-game, and ROM tiers are
# explicit because they have different dependency and fixture contracts; see
# docs/TEST_TIERS.md and .github/workflows/test-tiers.yml.
testpaths = ["tests", "retro_harness/tests", "retro_harness/platformer/tests", "retro_harness/adventure/tests"]
addopts = ["--import-mode=importlib", "-m", "not ml and not rom"]
markers = [
    "ml: requires the optional ml dependency group",
    "game: game-owned unit or offline test",
    "rom: requires a legally supplied ROM or real emulator integration",
    "rom_smoke: selected bounded real-ROM smoke acceptance",
]
